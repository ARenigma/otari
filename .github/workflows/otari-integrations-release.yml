name: Otari Integrations Release

# Publishes a package under integrations/ to PyPI when its tag is pushed:
# `pydantic-ai-otari-v0.2.0` publishes integrations/pydantic-ai-otari at 0.2.0.
# The version is bumped in that package's pyproject.toml by an ordinary PR
# first; the tag only says which commit to ship, and must name the version the
# file declares on a commit that is on main. See RELEASE.md.
#
# No GitHub Release is created. A Release here would become the repository's
# "Latest" in place of Otari's own, and otari-docker.yml and
# otari-sdk-codegen.yml run on every published Release.
#
# Publishing uses PyPI trusted publishing: no token is stored. Each project on
# PyPI trusts this repository, this workflow file and its own environment,
# `pypi-<package>`. One environment per package is what PyPI requires (two
# pending publishers may not share a configuration), and it also keeps one
# package's publish from ever uploading the other.

on:
  push:
    tags:
      - 'pydantic-ai-otari-v*'
      - 'langchain-otari-v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "3.14"

    - name: Check the tag against the package
      id: package
      env:
        TAG: ${{ github.ref_name }}
      run: |
        PACKAGE="${TAG%-v*}"
        VERSION="${TAG##*-v}"
        DIR="integrations/$PACKAGE"
        DECLARED="$(uv run --no-project python -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$DIR/pyproject.toml")"
        if [ "$DECLARED" != "$VERSION" ]; then
          echo "::error::$TAG names version $VERSION, but $DIR/pyproject.toml declares $DECLARED."
          exit 1
        fi
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::$TAG is not on main, so it was never reviewed or tested there."
          exit 1
        fi
        echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi-${{ needs.check.outputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: "3.14"

    - name: Build
      run: uv build "integrations/${{ needs.check.outputs.package }}" --out-dir dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
